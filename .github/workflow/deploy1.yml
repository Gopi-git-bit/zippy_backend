name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-deploy:
    name: Build, Test, Deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Node dependencies
        run: |
          cd backend
          npm install
          
      - name: Install Python dependencies
        run: |
          cd ai_agent
          pip install -r requirements.txt
          
      - name: Run Node.js tests (if any)
        run: |
          cd backend
          npm test
        continue-on-error: false
        
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          
      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200
        
      - name: Build Docker image
        run: |
          docker build -t registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/zippy-backend:${{ github.sha }} .
          docker tag registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/zippy-backend:${{ github.sha }} registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/zippy-backend:latest
          
      - name: Push Docker image to DigitalOcean Container Registry
        run: |
          docker push registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/zippy-backend:${{ github.sha }}
          docker push registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/zippy-backend:latest
          
      - name: Deploy to DigitalOcean App Platform
        run: |
          doctl apps create-deployment ${{ secrets.DO_APP_ID }} --wait
          
